baseURL = "https://docs.rpp.example/"
title = "RPP"
enableRobotsTXT = true
defaultContentLanguage = "en"

# Docsy theme via Hugo Modules. One-time setup: `mise run docs:setup`
# (runs `hugo mod get` + `npm install`). Requires Hugo *extended*.
[module]
  proxy = "direct"
  [[module.imports]]
    path = "github.com/google/docsy"
  [[module.imports]]
    path = "github.com/google/docsy/dependencies"

[languages]
  [languages.en]
    label = "English"
    contentDir = "content/en"
    weight = 1
  [languages.ru]
    label = "Русский"
    contentDir = "content/ru"
    weight = 2

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false

[params]
  github_repo = "https://git.ywa.red/gamedev/rpp"
  [params.ui]
    sidebar_menu_compact = true
    navbar_logo = false
