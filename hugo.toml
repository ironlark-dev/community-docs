baseURL = "https://docs.ironlark.net/"
title = "Ironlark"
enableRobotsTXT = true
defaultContentLanguage = "en"

# Docsy theme via Hugo Modules. Requires Hugo *extended*.
[module]
  proxy = "direct"
  [[module.imports]]
    path = "github.com/google/docsy"
  [[module.imports]]
    path = "github.com/google/docsy/dependencies"

[languages]
  [languages.en]
    label = "English"
    contentDir = "content/en"
    weight = 1

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false

[params]
  github_repo = "https://github.com/ironlark-dev/community-docs"
  [params.ui]
    sidebar_menu_compact = true
    navbar_logo = false
    # Follows the reader's system setting, with a switcher in the navbar.
    showLightDarkModeMenu = true
