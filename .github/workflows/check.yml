# Every gate the deploy runs, on the merge request instead of after it.
name: Check
on:
  pull_request:
permissions: {}
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Content and build gates
    runs-on: ubuntu-24.04
    # Checkout only; nothing here writes back.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install
        run: npm ci
      - name: Content rules
        run: npm run check
      - name: Build
        run: npm run build
      - name: Built links
        run: npm run check:built
